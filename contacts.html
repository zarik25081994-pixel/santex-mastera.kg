<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СантехМастер.KG — Контакты</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #334155; line-height: 1.6; }
        header { background: #fff; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }
        .logo { font-size: 22px; font-weight: 700; color: #007bff; text-decoration: none; }
        .logo span { color: #334155; font-size: 16px; font-weight: 400; }
        .nav-links { display: flex; list-style: none; gap: 20px; }
        .nav-links a { text-decoration: none; color: #64748b; font-weight: 500; font-size: 15px; }
        .nav-links a:hover, .nav-links a.active { color: #007bff; }
        .container { max-width: 600px; margin: 60px auto; padding: 0 20px; text-align: center; }
        .contact-card { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 50px 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.03); }
        h1 { margin-bottom: 15px; color: #1e293b; font-size: 28px; }
        .subtitle { color: #64748b; margin-bottom: 30px; font-size: 16px; }
        
        .call-btn { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            background: #007bff; 
            color: white; 
            padding: 18px 40px; 
            border-radius: 12px; 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 24px; 
            margin: 15px 0; 
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.2);
            width: 100%;
            max-width: 380px;
        }
        .call-btn:hover { background: #0056b3; transform: translateY(-2px); }
        .call-btn:active { transform: translateY(0); }
        
        .info-text { color: #475569; margin-top: 30px; font-size: 15px; font-weight: 500; }
        footer { background: #1e293b; color: #94a3b8; text-align: center; padding: 20px; position: absolute; bottom: 0; width: 100%; font-size: 14px; }
        html, body { height: 100%; position: relative; }
        @media (max-width: 768px) {
            .nav-container { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">🛠 СантехМастер<span>.KG</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Главная</a></li>
                <li><a href="services.html">Услуги</a></li>
                <li><a href="jobs.html">Вакансии</a></li>
                <li><a href="contacts.html" class="active">Контакты</a></li>
            </ul>
        </div>
    </header>

    <div class="container">
        <div class="contact-card">
            <h1>Наши контакты</h1>
            <p class="subtitle">Свяжитесь с нами для заказа услуг или по вопросам трудоустройства.</p>
            
            <a href="tel:0772556682" class="call-btn">📞 0772 55 66 82</a>
            
            <p class="info-text">Принимаем звонки ежедневно. Оперативный выезд мастера на объект.</p>
        </div>
    </div>

    <footer>
        &copy; 2026 СантехМастер.KG. Все права защищены.
    </footer>

</body>
</html>
